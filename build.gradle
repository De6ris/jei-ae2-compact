import java.text.SimpleDateFormat

plugins {
    alias(libs.plugins.architectury.loom)
}

base.archivesName = libs.versions.archives.name
version = "${libs.versions.version.get()}-mc${libs.versions.minecraft.version.get()}-neoforge-${new SimpleDateFormat("yyyyMMdd").format(new Date())}"
group = libs.versions.maven.group

repositories {
    mavenCentral()
    maven { url "https://www.jitpack.io" }
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url 'https://api.modrinth.com/maven' }
    maven { url "https://cursemaven.com" }
    maven {
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft libs.minecraft

    mappings loom.officialMojangMappings()

    neoForge libs.neoforge

    // compile against the JEI API but do not include it at runtime
    modCompileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // at runtime, use the full JEI jar for NeoForge
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    modImplementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    modImplementation("mekanism:Mekanism:${minecraft_version}-${mekanism_version}:all")

    modImplementation "curse.maven:applied-mekanistics-574300:5978711"

    implementation libs.jsr305
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}